<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cronwatch — Hi-fi prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  /* CSS vars driven by Tweaks */
  :root {
    --cw-font-display: 'Inter', -apple-system, system-ui, sans-serif;
    --cw-font-body: 'Inter', -apple-system, system-ui, sans-serif;
    --cw-font-num: 'Inter', -apple-system, system-ui, sans-serif;
  }
  .cw { font-family: var(--cw-font-body); -webkit-font-smoothing: antialiased; }
  .cw .num { font-family: var(--cw-font-num); font-variant-numeric: tabular-nums; }
  .cw .display { font-family: var(--cw-font-display); }
  /* hide scrollbars inside artboards */
  .cw-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .cw-scroll { scrollbar-width: none; }
  @keyframes cw-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,163,61,0.5), 0 6px 18px rgba(232,163,61,0.35); }
    50% { transform: scale(1.04); box-shadow: 0 0 0 18px rgba(232,163,61,0), 0 6px 18px rgba(232,163,61,0.45); }
  }
  @keyframes cw-wave {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }
  @keyframes cw-fadein-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cw-toast-in {
    0% { opacity: 0; transform: translate(-50%, 12px); }
    15%, 85% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -6px); }
  }
  @keyframes cw-sheet-in {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes cw-flash {
    0% { background: rgba(232,163,61,0.35); }
    100% { background: transparent; }
  }
  @keyframes cw-typing {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="cw-tokens.jsx"></script>
<script type="text/babel" src="cw-icons.jsx"></script>
<script type="text/babel" src="cw-data.jsx"></script>
<script type="text/babel" src="cw-screens.jsx"></script>
<script type="text/babel" src="cw-prototype.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
