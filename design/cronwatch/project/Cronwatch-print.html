<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cronwatch — Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cw-font-display: 'Inter', -apple-system, system-ui, sans-serif;
    --cw-font-body: 'Inter', -apple-system, system-ui, sans-serif;
    --cw-font-num: 'Inter', -apple-system, system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: var(--cw-font-body); -webkit-font-smoothing: antialiased; }
  .cw .num { font-variant-numeric: tabular-nums; }
  .cw-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .cw-scroll { scrollbar-width: none; }

  /* Print page setup — landscape, slim margins */
  @page { size: landscape; margin: 0.4cm; }

  .page {
    width: 1280px;
    height: 800px;
    margin: 24px auto;
    background: #f0eee9;
    display: flex;
    flex-direction: column;
    padding: 32px 40px;
    box-sizing: border-box;
    page-break-after: always;
    break-after: page;
    break-inside: avoid;
    position: relative;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  .page-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
    border-bottom: 1px solid #ECECEA;
    padding-bottom: 10px;
  }
  .page-head .ttl {
    font-size: 18px; font-weight: 600; color: #111; letter-spacing: -0.3px;
  }
  .page-head .sub {
    font-size: 12px; font-weight: 500; color: #9A9A95; letter-spacing: 0.4px; text-transform: uppercase;
  }

  .frames-row {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }
  .frame-cell {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .frame-cap {
    font-size: 11px; font-weight: 600; color: #5C5C58; letter-spacing: 0.2px;
  }

  /* Print tweaks: keep colors, avoid clipping */
  @media print {
    html, body { background: #fff; }
    .page { margin: 0; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="cw-tokens.jsx"></script>
<script type="text/babel" src="cw-icons.jsx"></script>
<script type="text/babel" src="cw-data.jsx"></script>
<script type="text/babel" src="cw-screens.jsx"></script>
<script type="text/babel" src="cw-prototype.jsx"></script>

<script type="text/babel">
const W = 360, H = 780;

function Frame({ children }) {
  return <IOSDevice width={W} height={H}>{children}</IOSDevice>;
}

function PrintApp() {
  return (
    <>
      {/* Page 1 — Cover */}
      <div className="page">
        <div className="page-head">
          <div className="ttl">Cronwatch · iOS prototype</div>
          <div className="sub">May 2026 · Hi-fi screens</div>
        </div>
        <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40, alignItems: 'center' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 14 }}>
              <WordmarkGlyph size={48} />
              <div style={{ fontSize: 40, fontWeight: 600, letterSpacing: -1, color: '#111' }}>Cronwatch</div>
            </div>
            <div style={{ fontSize: 22, color: '#111', letterSpacing: -0.3, lineHeight: 1.3, fontWeight: 450, maxWidth: 480 }}>
              Speak your time. See your day.
            </div>
            <div style={{ fontSize: 14, color: '#5C5C58', lineHeight: 1.6, maxWidth: 480, marginTop: 6, fontWeight: 450 }}>
              Voice-first time tracking. Hold the button, speak naturally — Cronwatch turns it into a structured 15-minute entry on a quiet, calm grid.
            </div>
            <div style={{ display: 'flex', gap: 12, marginTop: 8, flexWrap: 'wrap' }}>
              <Pill>Calm · focused · quietly modern</Pill>
              <Pill>Apple Notes × Linear</Pill>
              <Pill>Inter · Amber #E8A33D</Pill>
            </div>
            <div style={{ marginTop: 22, fontSize: 11, fontWeight: 600, color: '#9A9A95', textTransform: 'uppercase', letterSpacing: 0.6 }}>
              Seven screens · in this document
            </div>
            <ol style={{ margin: 0, paddingLeft: 20, fontSize: 13, color: '#111', fontWeight: 450, lineHeight: 1.85 }}>
              <li>Sign-in</li>
              <li>Overview / Home dashboard</li>
              <li>Today — 15-minute grid</li>
              <li>Capture sheet (FAB)</li>
              <li>Entry detail / edit</li>
              <li>Profile</li>
              <li>Paywall</li>
            </ol>
          </div>
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <Frame><StaticScreen kind="today" /></Frame>
          </div>
        </div>
      </div>

      {/* Page 2 — Sign-in + Overview */}
      <div className="page">
        <div className="page-head">
          <div className="ttl">1 · Sign-in &nbsp;·&nbsp; 2 · Overview</div>
          <div className="sub">Page 2 / 5</div>
        </div>
        <div className="frames-row">
          <div className="frame-cell">
            <Frame><StaticScreen kind="signin" /></Frame>
            <div className="frame-cap">1 · Sign-in</div>
          </div>
          <div className="frame-cell">
            <Frame><StaticScreen kind="home" /></Frame>
            <div className="frame-cap">2 · Overview / Home</div>
          </div>
          <div style={{ maxWidth: 280, fontSize: 12, color: '#5C5C58', lineHeight: 1.6, fontWeight: 450 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: '#111', marginBottom: 6 }}>Notes</div>
            <p style={{ margin: '0 0 10px' }}><strong style={{ color: '#111' }}>Sign-in</strong> stays quiet — wordmark, tagline, two filled buttons. No hero art.</p>
            <p style={{ margin: 0 }}><strong style={{ color: '#111' }}>Overview</strong> answers "where does my time go?" with a today donut, week averages, and a 21-day streak strip.</p>
          </div>
        </div>
      </div>

      {/* Page 3 — Today + Capture */}
      <div className="page">
        <div className="page-head">
          <div className="ttl">3 · Today &nbsp;·&nbsp; 4 · Capture sheet</div>
          <div className="sub">Page 3 / 5</div>
        </div>
        <div className="frames-row">
          <div className="frame-cell">
            <Frame><StaticScreen kind="today" /></Frame>
            <div className="frame-cap">3 · Today — 15-min grid</div>
          </div>
          <div className="frame-cell">
            <Frame><StaticScreen kind="today" withSheet="capture" /></Frame>
            <div className="frame-cap">4 · Capture sheet (FAB)</div>
          </div>
          <div style={{ maxWidth: 280, fontSize: 12, color: '#5C5C58', lineHeight: 1.6, fontWeight: 450 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: '#111', marginBottom: 6 }}>Notes</div>
            <p style={{ margin: '0 0 10px' }}><strong style={{ color: '#111' }}>Today</strong> renders 96 quarter-hour rows. Adjacent rows merge into rounded blocks; empty hours show a faint dashed divider; an amber line marks "now."</p>
            <p style={{ margin: 0 }}><strong style={{ color: '#111' }}>Capture</strong> is the single most important interaction — hold to record, live transcript fills, type fallback at the bottom.</p>
          </div>
        </div>
      </div>

      {/* Page 4 — Edit + Profile */}
      <div className="page">
        <div className="page-head">
          <div className="ttl">5 · Entry edit &nbsp;·&nbsp; 6 · Profile</div>
          <div className="sub">Page 4 / 5</div>
        </div>
        <div className="frames-row">
          <div className="frame-cell">
            <Frame><StaticScreen kind="today" withSheet="edit" /></Frame>
            <div className="frame-cap">5 · Entry detail / edit</div>
          </div>
          <div className="frame-cell">
            <Frame><StaticScreen kind="profile" /></Frame>
            <div className="frame-cap">6 · Profile</div>
          </div>
          <div style={{ maxWidth: 280, fontSize: 12, color: '#5C5C58', lineHeight: 1.6, fontWeight: 450 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: '#111', marginBottom: 6 }}>Notes</div>
            <p style={{ margin: '0 0 10px' }}><strong style={{ color: '#111' }}>Edit</strong> mirrors Capture's rhythm — chip picker for category (recents first), inline 15-min steppers for times, quiet Delete on the left.</p>
            <p style={{ margin: 0 }}><strong style={{ color: '#111' }}>Profile</strong> is rarely visited but finished. One subscription card, account rows, version footer.</p>
          </div>
        </div>
      </div>

      {/* Page 5 — Paywall + system */}
      <div className="page">
        <div className="page-head">
          <div className="ttl">7 · Paywall &nbsp;·&nbsp; Design language</div>
          <div className="sub">Page 5 / 5</div>
        </div>
        <div className="frames-row">
          <div className="frame-cell">
            <Frame><StaticScreen kind="paywall" /></Frame>
            <div className="frame-cap">7 · Paywall</div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16, width: 360 }}>
            <SwatchRow />
            <CategoryGrid />
            <TypeSpec />
          </div>
        </div>
      </div>
    </>
  );
}

function Pill({ children }) {
  return (
    <span style={{
      display: 'inline-block', padding: '5px 10px', borderRadius: 999,
      background: '#fff', border: '1px solid #ECECEA',
      fontSize: 11, fontWeight: 500, color: '#5C5C58', letterSpacing: -0.05,
    }}>{children}</span>
  );
}
function SwatchRow() {
  const swatches = [
    { name: 'BG', val: '#FAFAF7' },
    { name: 'Ink', val: '#111' },
    { name: 'Muted', val: '#5C5C58' },
    { name: 'Border', val: '#ECECEA' },
    { name: 'Amber', val: '#E8A33D' },
  ];
  return (
    <div>
      <div style={{ fontSize: 10, fontWeight: 600, color: '#9A9A95', textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 8 }}>Palette</div>
      <div style={{ display: 'flex', gap: 8 }}>
        {swatches.map(s => (
          <div key={s.name} style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ height: 36, borderRadius: 8, background: s.val, border: '1px solid #ECECEA' }} />
            <div style={{ fontSize: 10, fontWeight: 500, color: '#111', marginTop: 4 }}>{s.name}</div>
            <div className="num" style={{ fontSize: 9, color: '#9A9A95', fontWeight: 500 }}>{s.val}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
function CategoryGrid() {
  return (
    <div>
      <div style={{ fontSize: 10, fontWeight: 600, color: '#9A9A95', textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 8 }}>Categories</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6 }}>
        {Object.entries(CW.cats).map(([name, t]) => (
          <div key={name} style={{
            display: 'flex', alignItems: 'center', gap: 6,
            padding: '6px 8px', background: t.bg, borderRadius: 6,
          }}>
            <span style={{ width: 6, height: 6, borderRadius: 3, background: t.dot }} />
            <span style={{ fontSize: 10, fontWeight: 600, color: t.ink }}>{name}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
function TypeSpec() {
  return (
    <div>
      <div style={{ fontSize: 10, fontWeight: 600, color: '#9A9A95', textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 8 }}>Type · Inter</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
        <div style={{ fontSize: 22, fontWeight: 600, color: '#111', letterSpacing: -0.5, lineHeight: 1.1 }}>Title 22 / 600</div>
        <div style={{ fontSize: 15, fontWeight: 450, color: '#111', letterSpacing: -0.1 }}>Body 15 / 450 — quiet & legible</div>
        <div style={{ fontSize: 12, fontWeight: 500, color: '#9A9A95' }}>Caption 12 / 500</div>
        <div className="num" style={{ fontSize: 13, fontWeight: 500, color: '#111', marginTop: 2 }}>09:45 · 6h 15m · 23:45</div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PrintApp />);

// Auto-print after fonts + render settle
(async () => {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  // Wait for two animation frames so React commits + layout settles
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  setTimeout(() => { window.print(); }, 600);
})();
</script>
</body>
</html>
