# nginx reverse proxy for the Cronwatch capture proxy.
# Installed to /etc/nginx/sites-available/cronwatch.conf and symlinked
# into sites-enabled/ by scripts/setup-server.sh.
#
# Plain HTTP on the droplet IP. When you add a domain + TLS, replace
# `default_server` and run `certbot --nginx -d <domain>`.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Audio uploads are capped at 25MB by multer; nginx must allow at
    # least that plus form overhead.
    client_max_body_size 30M;

    # Capture round-trip is upload + Deepgram + Together AI. Keep generous
    # timeouts so nginx doesn't kill the request mid-LLM.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
