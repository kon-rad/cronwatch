name: cronwatch-server
region: nyc
services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: PORT
        value: "8080"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: AWS_REGION
        scope: RUN_TIME
        type: SECRET
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: S3_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: S3_KEY_PREFIX
        scope: RUN_TIME
        value: "captures"
      - key: DEEPGRAM_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEEPGRAM_MODEL
        scope: RUN_TIME
        value: "nova-3"
      - key: TOGETHER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TOGETHER_MODEL
        scope: RUN_TIME
        value: "meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        scope: RUN_TIME
        type: SECRET
