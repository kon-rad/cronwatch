# nginx reverse proxy for the Cronwatch landing page (Next.js standalone).
# Installed to /etc/nginx/sites-available/cronwatch-web.conf and symlinked
# into /etc/nginx/sites-enabled/ by setup-server.sh.
#
# Plain HTTP on port 80. After DNS propagation run:
#   certbot --nginx -d cronwatch.xyz -d www.cronwatch.xyz
# Certbot will rewrite this file to add the 443 block and HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name cronwatch.xyz www.cronwatch.xyz;

    # Next.js sends large hashed asset names; cache them aggressively.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
